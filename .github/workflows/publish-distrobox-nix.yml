name: Build and Publish Distrobox container (nix buildLayeredImage)

on:
  push:
    branches: ["main"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "pkgs/default.nix"
      - "pkgs/distrobox.nix"
      - ".github/workflows/publish.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "pkgs/default.nix"
      - "pkgs/distrobox.nix"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: distrobox-nix

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Install regctl
        if: github.event_name != 'pull_request'
        run: |
          rev=$(nix flake metadata --json | jq -r '.locks.nodes.nixpkgs.locked.rev')
          nix profile install "github:NixOS/nixpkgs/$rev#regctl"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! -f /etc/containers/policy.json ]]; then
            mkdir -p /etc/containers
            printf '{"default":[{"type":"insecureAcceptAnything"}]}' > /etc/containers/policy.json
          fi
          echo "$GHCR_TOKEN" | skopeo login "$REGISTRY" --username "${{ github.actor }}" --password-stdin
          echo "$GHCR_TOKEN" | regctl registry login "$REGISTRY" -u "${{ github.actor }}" --pass-stdin

      - name: Build and load image
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="$REGISTRY/$REPO_OWNER/$IMAGE_NAME:latest"

          nix build .#distrobox --out-link result
          podman load --input result

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=$REGISTRY/$REPO_OWNER/$IMAGE_NAME

          skopeo copy --format oci docker-archive:result oci-archive:oci.tar:out
          mkdir -p oci
          tar -xf oci.tar -C oci
          regctl image copy "ocidir://$PWD/oci:out" "$IMAGE_ID:latest"
          regctl image copy "ocidir://$PWD/oci:out" "$IMAGE_ID:$IMAGE_SHA"
          rm -rf oci oci.tar

      - name: Verify published GHCR image
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=$REGISTRY/$REPO_OWNER/$IMAGE_NAME

          token=$(curl -fsS -u "${{ github.actor }}:$GHCR_TOKEN" \
            "https://$REGISTRY/token?scope=repository:$REPO_OWNER/$IMAGE_NAME:pull" \
            | jq -r '.token')

          manifest=$(curl -fsS -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://$REGISTRY/v2/$REPO_OWNER/$IMAGE_NAME/manifests/latest")

          total=$(echo "$manifest" | jq -r '[.layers[]?.size] | add // 0')
          echo "Pull size of $IMAGE_ID:latest: $((total / 1000000)) MB"
          echo "published image verified successfully"
