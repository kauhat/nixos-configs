name: Build and Publish Distrobox

on:
  push:
    branches: ["main"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "pkgs/default.nix"
      - "pkgs/distrobox.nix"
      - ".github/workflows/publish.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "pkgs/default.nix"
      - "pkgs/distrobox.nix"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nix-distrobox

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Install regctl
        if: github.event_name != 'pull_request'
        run: |
          rev=$(nix flake metadata --json | jq -r '.locks.nodes.nixpkgs.locked.rev')
          nix profile install "github:NixOS/nixpkgs/$rev#regctl"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! -f /etc/containers/policy.json ]]; then
            mkdir -p /etc/containers
            printf '{"default":[{"type":"insecureAcceptAnything"}]}' > /etc/containers/policy.json
          fi
          echo "$GHCR_TOKEN" | skopeo login "$REGISTRY" --username "${{ github.actor }}" --password-stdin
          echo "$GHCR_TOKEN" | regctl registry login "$REGISTRY" -u "${{ github.actor }}" --pass-stdin

      - name: Build and load image
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="$REGISTRY/$REPO_OWNER/$IMAGE_NAME:latest"

          # Build derivation output directly
          nix build .#distrobox --out-link result

          # Load the tarball generated by dockerTools.buildImage
          podman load --input result

      - name: Verify image layout
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="$REGISTRY/$REPO_OWNER/$IMAGE_NAME:latest"

          podman run --rm --entrypoint /bin/sh "$IMAGE_TAG" -c '
            set -e
            for tool in grep sed awk find findmnt script mount usermod systemctl stat readlink nix; do
              command -v "$tool" > /dev/null || { echo "missing tool: $tool"; exit 1; }
            done
            for unit in basic.target sysinit.target multi-user.target sockets.target; do
              test -e "/usr/lib/systemd/system/$unit" || { echo "missing unit: $unit"; exit 1; }
            done
            test -e /bin/sh || { echo "missing /bin/sh"; exit 1; }
            test -e /usr/lib/systemd/systemd || { echo "missing systemd"; exit 1; }
            test -e /etc/pam.d/sudo || { echo "missing PAM config for sudo"; exit 1; }
            test -e /etc/systemd/system/multi-user.target.wants/nix-daemon.service || { echo "missing nix-daemon.service"; exit 1; }
            test -e /etc/nix/nix.conf || { echo "missing nix.conf"; exit 1; }
            grep -q "^root:" /etc/passwd || { echo "no root user"; exit 1; }
            echo "image layout verification passed"
          '

      - name: Verify image systemd integration
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="$REGISTRY/$REPO_OWNER/$IMAGE_NAME:latest"

          podman run --rm --entrypoint /usr/bin/systemctl "$IMAGE_TAG" \
            --root=/ list-unit-files | grep -q "^nix-daemon.service" || {
            echo "nix-daemon.service is not loadable"; exit 1; }

          podman run --rm --entrypoint /usr/bin/systemctl "$IMAGE_TAG" \
            --root=/ enable nix-daemon.service nix-daemon.socket || {
            echo "cannot enable the nix units"; exit 1; }

          podman run --rm --entrypoint /bin/sh "$IMAGE_TAG" -c '
            set -e
            test ! -L /etc/passwd || { echo "/etc/passwd links into the store"; exit 1; }
            test ! -L /etc/group || { echo "/etc/group links into the store"; exit 1; }
            echo "distrobox checks passed"
          '

      - name: Verify inside-container Nix derivation build
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="$REGISTRY/$REPO_OWNER/$IMAGE_NAME:latest"

          podman run --rm --entrypoint /bin/sh "$IMAGE_TAG" -c '
            set -e
            nix build --option sandbox false --no-link --expr "derivation {
              name = \"check\";
              system = \"x86_64-linux\";
              builder = \"/bin/sh\";
              args = [\"-c\" \"echo ok > \$out\"];
            }"
            echo "container nix daemon can build derivations"
          '

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=$REGISTRY/$REPO_OWNER/$IMAGE_NAME

          skopeo copy --format oci docker-archive:result oci-archive:oci.tar:out
          mkdir -p oci
          tar -xf oci.tar -C oci
          regctl image copy "ocidir://$PWD/oci:out" "$IMAGE_ID:latest"
          regctl image copy "ocidir://$PWD/oci:out" "$IMAGE_ID:$IMAGE_SHA"
          rm -rf oci oci.tar

      - name: Verify published GHCR image
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=$REGISTRY/$REPO_OWNER/$IMAGE_NAME

          token=$(curl -fsS -u "${{ github.actor }}:$GHCR_TOKEN" \
            "https://$REGISTRY/token?scope=repository:$REPO_OWNER/$IMAGE_NAME:pull" \
            | jq -r '.token')

          manifest=$(curl -fsS -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://$REGISTRY/v2/$REPO_OWNER/$IMAGE_NAME/manifests/latest")

          total=$(echo "$manifest" | jq -r '[.layers[]?.size] | add // 0')
          echo "Pull size of $IMAGE_ID:latest: $((total / 1000000)) MB"

          uncompressed=$(echo "$manifest" | jq -r '[.layers[]? | select(.mediaType != "application/vnd.oci.image.layer.v1.tar+gzip")] | length')
          if [[ "$uncompressed" != "0" ]]; then
            echo "$uncompressed layers are not gzip compressed"
            echo "$manifest" | jq -r '.layers[].mediaType' | sort | uniq -c
            exit 1
          fi

          digest=$(echo "$manifest" | jq -r '.layers[0].digest')
          magic=$(curl -fsSL -H "Authorization: Bearer $token" \
            "https://$REGISTRY/v2/$REPO_OWNER/$IMAGE_NAME/blobs/$digest" \
            | head -c 2 | od -An -tx1 | tr -d ' \n')
          if [[ "$magic" != "1f8b" ]]; then
            echo "layer $digest is not gzip compressed (magic: $magic)"
            exit 1
          fi
          echo "published image verified successfully"
