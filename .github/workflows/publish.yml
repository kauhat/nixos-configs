name: Build and Publish Distrobox

on:
  push:
    branches: ["main"]
    # Only trigger if the image definition, flake, or workflow changes
    paths:
      - "flake.nix"
      - "flake.lock"
      - "pkgs/default.nix"
      - "pkgs/distrobox.nix"
      - ".github/workflows/publish.yml"
  # Allow manual triggering from the GitHub UI
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nix-distrobox

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load image into Docker daemon
        # streamLayeredImage outputs a script that writes the image tarball to stdout
        run: nix run .#distrobox | docker load

      - name: Tag and push to GHCR
        run: |
          # GHCR requires repository names to be lowercase
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=${{ env.REGISTRY }}/$REPO_OWNER/${{ env.IMAGE_NAME }}

          # Tag the local image generated by Nix with the GHCR path
          docker tag local/nix-distrobox:latest $IMAGE_ID:latest
          docker tag local/nix-distrobox:latest $IMAGE_ID:${{ github.sha }}

          # Push to the registry
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:${{ github.sha }}
