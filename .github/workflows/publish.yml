name: Build and Publish Distrobox

on:
  push:
    branches: ["main"]
    # Only trigger if the image definition, flake, or workflow changes
    paths:
      - "flake.nix"
      - "flake.lock"
      - "pkgs/default.nix"
      - "pkgs/distrobox.nix"
      - ".github/workflows/publish.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "pkgs/default.nix"
      - "pkgs/distrobox.nix"
      - ".github/workflows/publish.yml"
  # Allow manual triggering from the GitHub UI
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nix-distrobox

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install regctl
        if: github.event_name != 'pull_request'
        # Pinned to the same nixpkgs the flake uses.
        run: |
          rev=$(nix flake metadata --json | jq -r '.locks.nodes.nixpkgs.locked.rev')
          nix profile install "github:NixOS/nixpkgs/$rev#regctl"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # skopeo needs a policy file to read and write images
          if [[ ! -f /etc/containers/policy.json ]]; then
            mkdir -p /etc/containers
            printf '{"default":[{"type":"insecureAcceptAnything"}]}' > /etc/containers/policy.json
          fi
          echo "$GHCR_TOKEN" | skopeo login "$REGISTRY" --username "$GHCR_USER" --password-stdin
          echo "$GHCR_TOKEN" | regctl registry login "$REGISTRY" -u "$GHCR_USER" --pass-stdin

      - name: Build and load image
        # streamLayeredImage outputs a script that writes the image tarball to
        # stdout.
        run: |
          nix build .#distrobox --out-link result
          ./result > image.tar
          podman load --input image.tar

      - name: Verify image
        # The distrobox entrypoint needs a userland and systemd units to be
        # present before it can set the container up, so check for them here
        # rather than finding out on the host.
        run: |
          podman run --rm --entrypoint /bin/sh local/nix-distrobox:latest -c '
            set -e
            for tool in grep sed awk find findmnt script mount usermod systemctl stat readlink nix; do
              command -v "$tool" > /dev/null || { echo "missing tool: $tool"; exit 1; }
            done
            for unit in basic.target sysinit.target multi-user.target sockets.target; do
              test -e "/usr/lib/systemd/system/$unit" || { echo "missing unit: $unit"; exit 1; }
            done
            test -e /usr/lib/systemd/systemd || { echo "missing systemd"; exit 1; }
            test -e /etc/pam.d/sudo || { echo "missing PAM config for sudo"; exit 1; }
            test -e /etc/systemd/system/multi-user.target.wants/nix-daemon.service || { echo "missing nix-daemon.service"; exit 1; }
            test -e /etc/nix/nix.conf || { echo "missing nix.conf"; exit 1; }
            grep -q "^nixbld1:" /etc/passwd || { echo "missing nixbld build users"; exit 1; }
            echo "image verification passed"
          '

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REPO_OWNER: ${{ github.repository_owner }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          # GHCR requires repository names to be lowercase
          REPO_OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=$REGISTRY/$REPO_OWNER/$IMAGE_NAME

          # The tarball that Nix builds has uncompressed layers, which makes
          # the image 2086 MB to pull. Converting it to an OCI archive
          # compresses every layer and brings that down to about 725 MB.
          #
          # The push has to be done with regctl rather than skopeo: skopeo
          # decompresses the layers again when copying to a registry.
          skopeo copy --format oci docker-archive:image.tar oci-archive:oci.tar:out
          mkdir -p oci
          tar -xf oci.tar -C oci
          regctl image copy "ocidir://$PWD/oci:out" "$IMAGE_ID:latest"
          regctl image copy "ocidir://$PWD/oci:out" "$IMAGE_ID:$IMAGE_SHA"
          rm -rf oci oci.tar image.tar

      - name: Verify published image
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REPO_OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          REPO_OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=$REGISTRY/$REPO_OWNER/$IMAGE_NAME

          token=$(curl -fsS -u "$GHCR_USER:$GHCR_TOKEN" \
            "https://$REGISTRY/token?scope=repository:$REPO_OWNER/$IMAGE_NAME:pull" \
            | jq -r '.token')

          manifest=$(curl -fsS -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://$REGISTRY/v2/$REPO_OWNER/$IMAGE_NAME/manifests/latest")

          # The size people actually pull.
          total=$(echo "$manifest" | jq -r '[.layers[]?.size] | add // 0')
          echo "Pull size of $IMAGE_ID:latest: $((total / 1000000)) MB"

          # The layers have to be compressed, not just labelled as such.
          uncompressed=$(echo "$manifest" | jq -r '[.layers[]? | select(.mediaType != "application/vnd.oci.image.layer.v1.tar+gzip")] | length')
          if [[ "$uncompressed" != "0" ]]; then
            echo "$uncompressed layers are not gzip compressed"
            echo "$manifest" | jq -r '.layers[].mediaType' | sort | uniq -c
            exit 1
          fi

          digest=$(echo "$manifest" | jq -r '.layers[0].digest')
          magic=$(curl -fsSL -H "Authorization: Bearer $token" \
            "https://$REGISTRY/v2/$REPO_OWNER/$IMAGE_NAME/blobs/$digest" \
            | head -c 2 | od -An -tx1 | tr -d ' \n')
          if [[ "$magic" != "1f8b" ]]; then
            echo "layer $digest is not gzip compressed (magic: $magic)"
            exit 1
          fi
          echo "published image verified"
