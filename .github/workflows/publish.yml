name: Build and Publish Distrobox

on:
  push:
    branches: ["main"]
    # Only trigger if the image definition, flake, or workflow changes
    paths:
      - "flake.nix"
      - "flake.lock"
      - "pkgs/default.nix"
      - "pkgs/distrobox.nix"
      - ".github/workflows/publish.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "pkgs/default.nix"
      - "pkgs/distrobox.nix"
      - ".github/workflows/publish.yml"
  # Allow manual triggering from the GitHub UI
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nix-distrobox

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # skopeo needs a policy file to read and write images
          if [[ ! -f /etc/containers/policy.json ]]; then
            mkdir -p /etc/containers
            printf '{"default":[{"type":"insecureAcceptAnything"}]}' > /etc/containers/policy.json
          fi
          echo "$GHCR_TOKEN" | skopeo login "$REGISTRY" --username "$GHCR_USER" --password-stdin

      - name: Build and load image
        # streamLayeredImage outputs a script that writes the image tarball to
        # stdout.
        run: |
          nix build .#distrobox --out-link result
          ./result > image.tar
          podman load --input image.tar

      - name: Verify image
        # The distrobox entrypoint needs a userland and systemd units to be
        # present before it can set the container up, so check for them here
        # rather than finding out on the host.
        run: |
          podman run --rm --entrypoint /bin/sh local/nix-distrobox:latest -c '
            set -e
            for tool in grep sed awk find findmnt script mount usermod systemctl stat readlink; do
              command -v "$tool" > /dev/null || { echo "missing tool: $tool"; exit 1; }
            done
            for unit in basic.target sysinit.target multi-user.target sockets.target; do
              test -e "/usr/lib/systemd/system/$unit" || { echo "missing unit: $unit"; exit 1; }
            done
            test -e /lib/systemd/systemd || { echo "missing systemd"; exit 1; }
            test -e /etc/systemd/system/multi-user.target.wants/nix-daemon.service || { echo "missing nix-daemon.service"; exit 1; }
            test -e /etc/nix/nix.conf || { echo "missing nix.conf"; exit 1; }
            echo "image verification passed"
          '

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REPO_OWNER: ${{ github.repository_owner }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          # GHCR requires repository names to be lowercase
          REPO_OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=$REGISTRY/$REPO_OWNER/$IMAGE_NAME

          # Copying as OCI compresses the layers. The tarball that Nix builds
          # has uncompressed layers, and pushing those as they are makes the
          # image three times bigger to pull.
          skopeo copy --format oci docker-archive:image.tar "docker://$IMAGE_ID:latest"
          skopeo copy --format oci docker-archive:image.tar "docker://$IMAGE_ID:$IMAGE_SHA"

      - name: Report image size
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REPO_OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          REPO_OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=$REGISTRY/$REPO_OWNER/$IMAGE_NAME

          # Ask the registry how big the image is to pull, which is the number
          # that matters for the people pulling it.
          curl -fsS -u "$GHCR_USER:$GHCR_TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json" \
            "https://$REGISTRY/v2/$REPO_OWNER/$IMAGE_NAME/manifests/latest" \
            | jq -r '[.layers[]?.size] | add // 0' \
            | awk '{printf "Pull size of %s: %.0f MB\n", "'"$IMAGE_ID"':latest", $1/1000000}'
