name: Build and Publish Distrobox container (fedora-toolbox based)

on:
  push:
    branches: ["main"]
    paths:
      - "Containerfile"
      - ".github/workflows/publish-distrobox-fedora-nix.yml"
  pull_request:
    paths:
      - "Containerfile"
      - ".github/workflows/publish-distrobox-fedora-nix.yml"
  schedule:
    # Runs at 00:00 UTC every Sunday
    - cron: "0 0 * * 0"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: distrobox-fedora-nix

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-fedora
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image with Podman
        run: |
          podman build \
            --tag ghcr.io/kauhat/nix-fedora-distrobox:latest \
            -f Containerfile .

      - name: Push to GHCR
        run: |
          podman push ghcr.io/kauhat/nix-fedora-distrobox:latest
