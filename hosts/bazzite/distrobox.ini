#
# Setup for the nix-toolbox distrobox on Bazzite.
#
# The setup script does this for you:
#
#   bash ~/Dev/jack/nixos-configs/hosts/bazzite/setup-distrobox.sh
#
# It pulls the image, creates the container from this file and installs the
# podman-host helper. The steps it runs:
#
# podman pull ghcr.io/kauhat/nix-distrobox:latest
# rm -rf ~/Toolbox/.ssh ~/Toolbox/Dev ~/Toolbox/Downloads ~/Toolbox/Notes
# distrobox assemble create --replace --file ~/Dev/jack/nixos-configs/hosts/bazzite/distrobox.ini --name nix-toolbox-next
# mkdir -p ~/Toolbox/.local/bin ; curl -s https://raw.githubusercontent.com/89luca89/distrobox/main/extras/podman-host -o ~/Toolbox/.local/bin/podman-host ; chmod +x ~/Toolbox/.local/bin/podman-host
#
# Then, inside the container:
#
# distrobox enter nix-toolbox-next
# nix run home-manager -- switch --flake $(realpath ~/Dev/jack/nixos-configs-private) -b backup
# sudo $(which non-nixos-gpu-setup)

# The hooks run as root, so they do not need sudo. The ones that touch the
# user have to be init_hooks rather than pre_init_hooks: the container user
# is only created after the pre-init hooks have run, and a failing pre-init
# hook aborts the container setup.
[nix-toolbox]
image=ghcr.io/kauhat/distrobox-fedora-nix:latest
init=true
nvidia=true
home="/home/jack/Toolbox"
volume="nix-data:/nix"
pre_init_hooks="ln -sfn /home/jack/.ssh /home/jack/Toolbox/.ssh;"
pre_init_hooks="ln -sfn /home/jack/Dev /home/jack/Toolbox/Dev;"
pre_init_hooks="ln -sfn /home/jack/Downloads /home/jack/Toolbox/Downloads;"
pre_init_hooks="ln -sfn /home/jack/Notes /home/jack/Toolbox/Notes;"
init_hooks="systemctl enable nix-daemon.service nix-daemon.socket; usermod -aG video,render jack; chown jack /home/jack/Toolbox;"

# Same as nix-toolbox, so both can be used side by side. Both containers
# share the nix-data volume, so the nix store is common to them: run one at
# a time, since the nix daemon socket lives in that volume and only one of
# them can bind it.
[nix-toolbox-next]
image=ghcr.io/kauhat/distrobox-nix:latest
init=true
nvidia=true
home="/home/jack/Toolbox"
volume="nix-data:/nix"
pre_init_hooks="ln -sfn /home/jack/.ssh /home/jack/Toolbox/.ssh;"
pre_init_hooks="ln -sfn /home/jack/Dev /home/jack/Toolbox/Dev;"
pre_init_hooks="ln -sfn /home/jack/Downloads /home/jack/Toolbox/Downloads;"
pre_init_hooks="ln -sfn /home/jack/Notes /home/jack/Toolbox/Notes;"
init_hooks="systemctl enable nix-daemon.service nix-daemon.socket; usermod -aG video,render jack; chown jack /home/jack/Toolbox;"

# Force container apps to use the host's actual D-Bus session socket
#volume="/run/user/1000/bus:/run/user/1000/host_bus:ro"
#container_environment="DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/host_bus"

#init_hooks="runuser -l jack -c /usr/local/bin/container-bootstrap;"
#init_hooks="su jack -c \"nix profile install github:nix-community/nixGL --impure\";"
#init_hooks="su jack -c \"nix profile install nixpkgs#home-manager\";"
#init_hooks="chsh jack -s /usr/bin/fish;"

